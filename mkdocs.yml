# Generated by `python -m scripts.generate_docs_site`. Do not edit.
# Regenerate after changing docs/document-manifest.json.

site_name: Interview Agent
site_description: Interview Agent 文档站：产品、架构、开发、验证、发布与运维的完整生命周期。
site_url: https://interview-agent.github.io/interview-agent/
docs_dir: docs
repo_url: https://github.com/interview-agent/interview-agent
repo_name: interview-agent
exclude_docs: 'ux/

  '
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
  nav:
    omitted_files: ignore
    not_found: ignore
theme:
  name: material
  language: en
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - navigation.top
  - search.suggest
  - search.highlight
  - content.code.copy
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- toc:
    permalink: true
- attr_list
- md_in_html
- def_list
- footnotes
- tables
plugins:
- search
- i18n:
    docs_structure: folder
    reconfigure_material: true
    reconfigure_search: true
    fallback_to_default: true
    languages:
    - locale: en
      name: English
      default: true
      build: true
    - locale: zh-CN
      name: 简体中文
      build: true
      theme:
        language: zh
