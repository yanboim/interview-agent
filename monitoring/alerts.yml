groups:
  - name: interview-agent
    rules:
      - alert: InterviewAgentDependencyErrors
        expr: increase(interview_agent_dependency_errors_total[10m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Interview Agent dependency errors are increasing"
      - alert: InterviewAgentDependencySlow
        expr: |
          rate(interview_agent_dependency_duration_seconds_total[5m])
          /
          clamp_min(rate(interview_agent_dependency_calls_total[5m]), 0.001)
          > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Interview Agent dependency latency is above 5 seconds"
      - alert: InterviewAgentWorkflowV2Failures
        expr: |
          increase(interview_agent_workflow_runs_total{
            workflow="chat-workflow-v2",outcome="failed"
          }[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Workflow V2 has failed production executions"
      - alert: InterviewAgentWorkflowV2CompletionRegression
        expr: |
          sum(increase(interview_agent_workflow_runs_total{
            workflow="chat-workflow-v2",outcome="completed"
          }[30m]))
          /
          clamp_min(sum(increase(interview_agent_workflow_runs_total{
            workflow="chat-workflow-v2"
          }[30m])), 1)
          < 0.95
          and
          sum(increase(interview_agent_workflow_runs_total{
            workflow="chat-workflow-v2"
          }[30m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Workflow V2 completion rate is below 95 percent"
