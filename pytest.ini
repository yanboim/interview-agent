[pytest]
pythonpath = .
markers =
    unit: deterministic pure or adapter test with no external service
    application: application use-case and lifecycle test
    contract: API, workflow, or repository contract test
    integration: requires external local services such as PostgreSQL
    architecture: dependency and repository-boundary test
    migration: database revision and upgrade test
    fault_injection: explicit failure, concurrency, timeout, or crash-recovery test
testpaths = tests
