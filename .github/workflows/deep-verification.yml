name: Deep verification

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify immutable dependency and image inputs
        run: python -m scripts.reproducibility check
      - run: pip install --require-hashes -r requirements.txt
      - run: npm ci --prefix frontend
      - name: Install the canonical Harness browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the complete repository Harness
        run: make harness-check PYTHON=python NPM=npm
      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 3

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run audit:dependencies --prefix frontend

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: interview-agent:deep-verification
          load: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: interview-agent:deep-verification
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
