name: Docs site

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - scripts/generate_docs_site.py
      - scripts/generate_docs.py
      - scripts/generate_chinese_docs.py
      - requirements-docs.txt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation toolchain
        run: pip install -r requirements-docs.txt
      - name: Regenerate generated references and Chinese mirror
        run: |
          python -m scripts.generate_docs
          python -m scripts.generate_chinese_docs
      - name: Verify mkdocs.yml matches the manifest
        run: python -m scripts.generate_docs_site --check
      - name: Build the site strictly
        run: python -m mkdocs build --strict
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
