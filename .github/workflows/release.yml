name: Release candidate

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [canary, production]
        default: canary
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify immutable dependency and image inputs
        run: python -m scripts.reproducibility check
      - run: pip install --require-hashes -r requirements.txt
      - run: npm ci --prefix frontend
      - name: Install browser required by the canonical Harness
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the canonical repository Harness
        run: make harness-check PYTHON=python NPM=npm

  package:
    needs: verify-harness
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t interview-lab:${{ github.ref_name }} .
      - name: Scan release image for fixable high-severity vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: interview-lab:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - run: docker save interview-lab:${{ github.ref_name }} -o interview-lab-image.tar
      - run: sha256sum interview-lab-image.tar > interview-lab-image.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: interview-lab-${{ inputs.channel || 'production' }}-${{ github.ref_name }}
          path: |
            interview-lab-image.tar
            interview-lab-image.sha256
          retention-days: 14
