name: Release candidate

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [canary, production]
        default: canary
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    environment: ${{ inputs.channel || 'production' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci --prefix frontend
      - run: pytest -q
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run check:bundle --prefix frontend
      - run: docker build -t interview-lab:${{ github.ref_name }} .
      - run: docker save interview-lab:${{ github.ref_name }} -o interview-lab-image.tar
      - run: sha256sum interview-lab-image.tar > interview-lab-image.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: interview-lab-${{ inputs.channel || 'production' }}-${{ github.ref_name }}
          path: |
            interview-lab-image.tar
            interview-lab-image.sha256
          retention-days: 14
