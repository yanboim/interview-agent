name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify immutable dependency and image inputs
        run: python -m scripts.reproducibility check
      - run: pip install --require-hashes -r requirements.txt
      - run: npm ci --prefix frontend
      - name: Run deterministic pull-request gate
        run: make pr-check PYTHON=python NPM=npm
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/migration.db
